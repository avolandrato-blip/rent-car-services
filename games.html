<body>
<div class="wrap">
<header class="top"><div class="brand">RENT CAR <span>SERVICES</span></div><a class="tag" href="index.html#fun" style="text-decoration:none">← Médias &amp; divertissement</a></header>

<script>
(()=>{
const games=[
['❌','Morpion','Aligne 3 symboles · solo ou duel','morpion'],
['🐍','Snake','Mange, grandis et évite les obstacles','snake'],
['⚡','Test de réflexe','Appuie dès que le signal apparaît','reflex'],
['✊','Pierre-Feuille-Ciseaux','Affronte l’ordinateur ou un ami','rps'],
['💣','Démineur','Trois niveaux de difficulté','mine'],
['♟️','Jeu de dames','Deux joueurs ou défi contre l’ordinateur','checkers'],
['🏎️','Course automobile','Évite les obstacles et tiens la route','race'],
['🃏','Bataille de cartes','La carte la plus forte gagne','battle'],
['🎲','Ludo','Ramène tes quatre pions à la maison','ludo'],
['🔴','Puissance 4','Aligne quatre pions pour gagner','connect']
];
const $=s=>document.querySelector(s), home=$('#home'),play=$('#play'),area=$('#gameArea'),status=$('#gameStatus'),tools=$('#gameTools');
let current='',cleanup=()=>{},restart=()=>{};
$('#gameGrid').innerHTML=games.map(g=>`<article class="game-card"><div class="emoji">${g[0]}</div><h2>${g[1]}</h2><p>${g[2]}</p><button class="btn primary" data-game="${g[3]}">Jouer →</button></article>`).join('');
$('#gameGrid').addEventListener('click',e=>{let b=e.target.closest('[data-game]');if(b)openGame(b.dataset.game)});
$('#back').onclick=()=>{cleanup();play.classList.remove('active');home.classList.add('active')};
$('#restart').onclick=()=>restart();
function say(t){status.textContent=t}
function setup(id,title,opts=''){current=id;cleanup();home.classList.remove('active');play.classList.add('active');$('#gameTitle').textContent=title;tools.innerHTML=opts;area.innerHTML='';say('Bonne partie !')}
function btn(label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.type='button';b.onclick=fn;return b}
function select(label,options,onchange){let s=document.createElement('select');s.setAttribute('aria-label',label);options.forEach(o=>{let x=document.createElement('option');x.value=o[0];x.textContent=o[1];s.append(x)});s.onchange=onchange;tools.append(s);return s}
function openGame(id){({morpion,snake,reflex,rps,mine,checkers,race,battle,ludo,connect})[id]()}
function morpion(){setup('morpion','Morpion');let mode='cpu',turn='X',board=Array(9).fill(''),over=false;tools.append(btn('Vs ordinateur',()=>{mode='cpu';reset()}),btn('2 joueurs',()=>{mode='two';reset()}));let el=document.createElement('div');el.className='board';el.style.gridTemplateColumns='repeat(3,1fr)';area.append(el);function winner(b){for(let [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'draw':null}function render(){el.innerHTML='';board.forEach((v,i)=>{let c=btn(v||' ',()=>move(i),'cell');c.style.aspectRatio='1';c.disabled=!!v||over;el.append(c)})}function move(i){if(board[i]||over)return;board[i]=turn;let w=winner(board);if(w){over=true;say(w==='draw'?'Match nul !':w+' gagne !')}else{turn=turn==='X'?'O':'X';if(mode==='cpu'&&turn==='O')setTimeout(ai,250);else say('Au tour de '+turn)}render()}function ai(){let empty=board.map((v,i)=>v?null:i).filter(v=>v!==null),best=-1;for(let p of ['O','X']){for(let i of empty){let b=board.slice();b[i]=p;if(winner(b)===p){best=i;break}}if(best>=0)break}if(best<0)best=empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)];move(best)}function reset(){board=Array(9).fill('');turn='X';over=false;say('Au tour de X');render()}restart=reset;reset()}
function snake(){setup('snake','Snake');area.innerHTML='<div class="arena"><canvas id="snakeCanvas" width="320" height="320" style="width:min(100%,320px);background:#171a20;border:2px solid #4b5360;border-radius:10px;touch-action:none"></canvas><p class="muted">Utilise les flèches ou les boutons. Sur mobile, touche les directions.</p><div class="controls" id="dirs"></div><div class="big" id="snakeScore">0</div></div>';let c=$('#snakeCanvas'),ctx=c.getContext('2d'),snake,food,dir,next,score,timer,dead=false;let dirs=[['↑',0,-1],['←',-1,0],['↓',0,1],['→',1,0]];$('#dirs').innerHTML=dirs.map(d=>`<button type="button" data-x="${d[1]}" data-y="${d[2]}">${d[0]}</button>`).join('');$('#dirs').onclick=e=>{let b=e.target.closest('button');if(b)change(+b.dataset.x,+b.dataset.y)};function change(x,y){if(x===-dir[0]&&y===-dir[1])return;next=[x,y]}function place(){do{food=[Math.floor(Math.random()*16),Math.floor(Math.random()*16)]}while(snake.some(p=>p[0]===food[0]&&p[1]===food[1]))}function draw(){ctx.clearRect(0,0,320,320);ctx.fillStyle='#d9ad55';ctx.fillRect(food[0]*20+3,food[1]*20+3,14,14);snake.forEach((p,i)=>{ctx.fillStyle=i?'#50c58a':'#4b9cff';ctx.fillRect(p[0]*20+1,p[1]*20+1,18,18)})}function tick(){if(dead)return;dir=next;let h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(h[0]<0||h[1]<0||h[0]>15||h[1]>15||snake.some(p=>p[0]===h[0]&&p[1]===h[1])){dead=true;clearInterval(timer);say('Partie terminée ! Score : '+score);return}snake.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){score++;$('#snakeScore').textContent=score;place()}else snake.pop();draw()}function reset(){clearInterval(timer);snake=[[8,8],[7,8],[6,8]];dir=[1,0];next=[1,0];score=0;dead=false;$('#snakeScore').textContent='0';place();draw();say('À toi de jouer !');timer=setInterval(tick,145)}function key(e){let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();change(...m[e.key])}}window.addEventListener('keydown',key);cleanup=()=>{clearInterval(timer);window.removeEventListener('keydown',key)};restart=reset;reset()}
function reflex(){setup('reflex','Test de réflexe');area.innerHTML='<div class="arena"><div class="big" id="refTime">—</div><button class="target" id="refTarget">Appuie sur DÉMARRER</button><p class="muted">Attends que le fond devienne vert, puis touche le plus vite possible.</p></div>';let b=$('#refTarget'),t=$('#refTime'),timer=null,start=0,state='idle';function reset(){clearTimeout(timer);state='idle';t.textContent='—';b.className='target';b.textContent='DÉMARRER';say('Prêt ?')}b.onclick=()=>{if(state==='idle'){state='wait';b.textContent='Attends le signal…';b.classList.add('wait');say('Ne clique pas trop tôt !');timer=setTimeout(()=>{state='go';start=performance.now();b.className='target ready';b.textContent='MAINTENANT !'},900+Math.random()*2800)}else if(state==='wait'){clearTimeout(timer);state='idle';b.textContent='Trop tôt ! Recommencer';b.className='target';say('Faux départ !')}else if(state==='go'){let ms=Math.round(performance.now()-start);state='done';t.textContent=ms+' ms';b.textContent='Rejouer';b.className='target';say(ms<220?'Excellent réflexe !':ms<350?'Très bien !':'Essaie encore !')}};restart=reset;reset()}
function rps(){setup('rps','Pierre · Feuille · Ciseaux');let mode='cpu',score=[0,0];tools.append(btn('Vs ordinateur',()=>{mode='cpu';say('Mode ordinateur') }),btn('2 joueurs',()=>{mode='two';say('Mode deux joueurs') }));area.innerHTML='<div class="arena"><div class="big" id="rpsResult">Choisis ton coup</div><div class="controls" id="rpsBtns"></div><p id="rpsScore" class="muted">Score : 0 – 0</p></div>';let choices=[['✊','Pierre'],['✋','Feuille'],['✌️','Ciseaux']],first=null;$('#rpsBtns').innerHTML=choices.map((x,i)=>`<button type="button" data-i="${i}"><span class="hand">${x[0]}</span><br>${x[1]}</button>`).join('');$('#rpsBtns').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let n=+b.dataset.i;if(mode==='two'&&!first){first=n;$('#rpsResult').textContent='Joueur 2 : choisis';return}let m=mode==='two'?n:Math.floor(Math.random()*3),a=mode==='two'?first:n;first=null;let result=a===m?'Égalité':(a-m+3)%3===1?'Joueur 1 gagne':'Joueur 2 / ordinateur gagne';if(a!==m)score[(a-m+3)%3===1?0:1]++;$('#rpsResult').textContent=choices[a][0]+' vs '+choices[m][0]+' — '+result;$('#rpsScore').textContent='Score : '+score.join(' – ')};restart=()=>{score=[0,0];first=null;$('#rpsResult').textContent='Choisis ton coup';$('#rpsScore').textContent='Score : 0 – 0'}}
function mine(){setup('mine','Démineur');let level='easy';let sel=select('Difficulté',[['easy','Facile · 8 mines'],['medium','Moyen · 14 mines'],['hard','Difficile · 22 mines']],reset);let n=9,mines=8,grid=[],opened=[],flags=[],done=false;function reset(){n=level==='easy'?9:level==='medium'?10:12;mines=level==='easy'?8:level==='medium'?14:22;sel.value=level;grid=Array(n*n).fill(0);opened=Array(n*n).fill(false);flags=Array(n*n).fill(false);done=false;let positions=[];while(positions.length<mines){let x=Math.floor(Math.random()*n*n);if(!positions.includes(x))positions.push(x)}positions.forEach(i=>grid[i]=-1);grid.forEach((v,i)=>{if(v===-1)return;let r=Math.floor(i/n),c=i%n;let count=0;for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){let rr=r+y,cc=c+x;if(rr>=0&&rr<n&&cc>=0&&cc<n&&grid[rr*n+cc]===-1)count++}grid[i]=count});render();say('Trouve les cases sans mine. Clic droit ou appui long pour poser un drapeau.')}function render(){let el=document.createElement('div');el.className='tiles';el.style.gridTemplateColumns=`repeat(${n},1fr)`;el.style.maxWidth=n>10?'500px':'420px';grid.forEach((v,i)=>{let b=btn(opened[i]?(v===-1?'💣':v||''):flags[i]?'🚩':'',()=>reveal(i),'cell');b.style.fontSize=n>10?'1rem':'1.2rem';b.oncontextmenu=e=>{e.preventDefault();if(!opened[i]&&!done){flags[i]=!flags[i];render()}};let press; b.addEventListener('touchstart',()=>press=setTimeout(()=>{if(!opened[i]&&!done){flags[i]=!flags[i];render()}},550),{passive:true});b.addEventListener('touchend',()=>clearTimeout(press));el.append(b)});area.innerHTML='';area.append(el)}function reveal(i){if(done||opened[i]||flags[i])return;opened[i]=true;if(grid[i]===-1){done=true;opened=grid.map(()=>true);say('💥 Mine ! Partie terminée.');render();return}if(grid[i]===0){let stack=[i];while(stack.length){let k=stack.pop(),r=Math.floor(k/n),c=k%n;for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){let rr=r+y,cc=c+x,j=rr*n+cc;if(rr>=0&&rr<n&&cc>=0&&cc<n&&!opened[j]&&grid[j]!==-1){opened[j]=true;if(grid[j]===0)stack.push(j)}}}}if(opened.filter((v,i)=>v&&grid[i]!==-1).length===n*n-mines){done=true;say('🏆 Bravo, toutes les cases sont découvertes !')}render()}restart=reset;sel.onchange=()=>{level=sel.value;reset()};reset()}
function checkers(){setup('checkers','Jeu de dames');let mode='cpu';tools.append(btn('Vs ordinateur',()=>{mode='cpu';reset()}),btn('2 joueurs',()=>{mode='two';reset()}));let b=[],turn=1,selected=null,over=false;let el=document.createElement('div');el.className='board';el.style.gridTemplateColumns='repeat(8,1fr)';area.append(el);function reset(){b=Array(64).fill(0);for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)b[r*8+c]=-1;for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)b[r*8+c]=1;turn=1;selected=null;over=false;say('À Rouge de jouer');render()}function moves(i,board=b,side=turn){let r=Math.floor(i/8),c=i%8,p=board[i],king=Math.abs(p)===2,dirs=king?[-1,1]:[side===1?-1:1];let out=[];for(let dr of dirs)for(let dc of [-1,1]){let rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8){let j=rr*8+cc;if(!board[j])out.push([j,-1]);else if(Math.sign(board[j])===-side){let r2=rr+dr,c2=cc+dc;if(r2>=0&&r2<8&&c2>=0&&c2<8&&!board[r2*8+c2])out.push([r2*8+c2,j])}}}return out}function render(){el.innerHTML='';b.forEach((v,i)=>{let r=Math.floor(i/8),c=i%8,x=btn(v?(Math.abs(v)===2?'♛': '●'):'',()=>click(i),'cell '+((r+c)%2?'dark':'light')+(selected===i?' selected':''));x.style.fontSize='1.3rem';x.style.color=v>0?'#ff7777':'#17191e';el.append(x)})}function click(i){if(over)return;if(selected===null){if(b[i]&&Math.sign(b[i])===turn){selected=i;render()}return}let m=moves(selected).find(x=>x[0]===i);if(m){let p=b[selected];b[selected]=0;b[i]=p;if(m[1]>=0)b[m[1]]=0;if((turn===1&&i<8)||(turn===-1&&i>=56))b[i]=turn*2;selected=null;turn*=-1;let count=b.filter(x=>Math.sign(x)===turn).length;if(!count){over=true;say((turn===1?'Noir':'Rouge')+' gagne !')}else{say(turn===1?'À Rouge de jouer':'À Noir de jouer');if(mode==='cpu'&&turn===-1)setTimeout(ai,300)}render()}else{selected=b[i]&&Math.sign(b[i])===turn?i:null;render()}}function ai(){let all=[];b.forEach((v,i)=>{if(Math.sign(v)===-1)moves(i,b,-1).forEach(m=>all.push([i,m[0],m[1]]))});if(!all.length){over=true;say('Rouge gagne !');return}all.sort((a,z)=>(z[2]>=0?1:0)-(a[2]>=0?1:0));let m=all[0],p=b[m[0]];b[m[0]]=0;b[m[1]]=p;if(m[2]>=0)b[m[2]]=0;if(m[1]>=56)b[m[1]]=-2;turn=1;say('À Rouge de jouer');render()}restart=reset;reset()}
function race(){setup('race','Course automobile');area.innerHTML='<div class="arena"><div class="race"><div class="race-track" id="track"><div class="car" id="player" style="bottom:12px;left:50%">🚗</div></div></div><div class="big" id="raceScore">0</div><div class="controls"><button id="left">← Gauche</button><button id="go" class="primary">Démarrer</button><button id="right">Droite →</button></div><p class="muted">Évite les véhicules qui arrivent. Utilise les flèches ou les boutons.</p></div>';let track=$('#track'),car=$('#player'),scoreEl=$('#raceScore'),lane=1,obs=[],score=0,running=false,raf=0,last=0;function move(d){lane=Math.max(0,Math.min(2,lane+d));car.style.left=(lane*30+20)+'%'}$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);function key(e){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)}window.addEventListener('keydown',key);function frame(t){if(!running)return;if(t-last>850){let o=document.createElement('div');o.className='obstacle';o.textContent=['🚙','🚕','🚚'][Math.floor(Math.random()*3)];let l=Math.floor(Math.random()*3);o.style.left=(l*30+20)+'%';o.style.top='-35px';track.append(o);obs.push({el:o,l,y:-35});last=t}obs.forEach(o=>{o.y+=4.1;o.el.style.top=o.y+'px'});obs=obs.filter(o=>{if(o.y>420){o.el.remove();score++;scoreEl.textContent=score;return false}if(o.y>330&&o.y<390&&o.l===lane){running=false;say('Collision ! Score : '+score);$('#go').textContent='Rejouer';return true}return true});if(running)raf=requestAnimationFrame(frame)}function reset(){cancelAnimationFrame(raf);obs.forEach(o=>o.el.remove());obs=[];lane=1;score=0;scoreEl.textContent='0';car.style.left='50%';running=false;$('#go').textContent='Démarrer';say('Prêt pour la course ?')}$('#go').onclick=()=>{if(running)return;reset();running=true;last=0;$('#go').textContent='En course…';say('Évite les obstacles !');raf=requestAnimationFrame(frame)};cleanup=()=>{running=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',key)};restart=reset;reset()}
function battle(){setup('battle','Bataille de cartes');let mode='cpu';tools.append(btn('Vs ordinateur',()=>{mode='cpu';reset()}),btn('2 joueurs',()=>{mode='two';reset()}));area.innerHTML='<div class="arena"><div class="big" id="cards">🂠 VS 🂠</div><p id="cardScore" class="muted"></p><button class="primary" id="draw">Retourner les cartes</button></div>';let deck=[],a=[],b=[],round=0;function reset(){deck=Array.from({length:52},(_,i)=>i%13+2);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}a=deck.slice(0,26);b=deck.slice(26);round=0;update();say('La carte la plus forte remporte le pli.')}function update(){ $('#cardScore').textContent='Cartes restantes — Joueur 1 : '+a.length+' · '+(mode==='cpu'?'Ordinateur':'Joueur 2')+' : '+b.length}function draw(){if(!a.length||!b.length){say(a.length===b.length?'Égalité !':a.length?'🏆 Joueur 1 gagne !':'🏆 '+(mode==='cpu'?'Ordinateur':'Joueur 2')+' gagne !');return}let x=a.shift(),y=b.shift(),msg='Joueur 1 : '+name(x)+'  ·  '+(mode==='cpu'?'Ordinateur':'Joueur 2')+' : '+name(y);if(x>y){a.push(x,y);msg+=' — pli au joueur 1'}else if(y>x){b.push(y,x);msg+=' — pli au joueur 2'}else{a.push(x);b.push(y);msg+=' — égalité'}round++;$('#cards').textContent=msg;update();if(round%10===0)say('Manche '+round)}function name(v){return ['','',...'2,3,4,5,6,7,8,9,10,V,D,R,A'.split(',')][v]||v}$('#draw').onclick=draw;restart=reset;reset()}
function ludo(){setup('ludo','Ludo · Petits chevaux');let mode='cpu';tools.append(btn('Vs ordinateur',()=>{mode='cpu';reset()}),btn('2 joueurs',()=>{mode='two';reset()}));area.innerHTML='<div class="arena"><div class="big" id="ludoDice">🎲</div><div id="ludoBoard" class="controls"></div><p id="ludoInfo" class="muted"></p><button class="primary" id="roll">Lancer le dé</button></div>';let pos=[[-1,-1,-1,-1],[-1,-1,-1,-1]],turn=0,dice=0;function reset(){pos=[[-1,-1,-1,-1],[-1,-1,-1,-1]];turn=0;dice=0;render();say('Joueur 1 : lance le dé. Il faut faire 6 pour sortir un pion.')}function render(){$('#ludoBoard').innerHTML=pos.map((p,i)=>`<div style="padding:10px;border:1px solid #444;border-radius:10px">J${i+1} : ${p.map(x=>x<0?'🏠':x>=40?'🏁':x).join(' · ')}</div>`).join('');$('#ludoInfo').textContent='Tour du joueur '+(turn+1)+(mode==='cpu'&&turn===1?' (ordinateur)':'')+'. Choisis un pion après le lancer.'}function roll(){if(mode==='cpu'&&turn===1)return;dice=1+Math.floor(Math.random()*6);$('#ludoDice').textContent='🎲 '+dice;let available=pos[turn].map((p,i)=>({p,i})).filter(x=>x.p<40&&(x.p>=0||dice===6));if(!available.length){say('Aucun déplacement possible.');if(dice!==6)next();return}say('Dé '+dice+' : choisis un pion.');if(mode==='cpu'&&turn===1){play(available[0].i);return}$('#ludoBoard').querySelectorAll('button').forEach(x=>x.remove());available.forEach(x=>$('#ludoBoard').append(btn('Pion '+(x.i+1),()=>play(x.i))))}function play(i){let p=pos[turn][i];pos[turn][i]=p<0?0:Math.min(40,p+dice);if(pos[turn][i]===40){say('🏆 Joueur '+(turn+1)+' a gagné !');$('#roll').disabled=true;return}if(dice!==6)next();else say('Tu as fait 6 : rejoue !');render();if(mode==='cpu'&&turn===1)setTimeout(roll,500)}function next(){turn=1-turn;render();if(mode==='cpu'&&turn===1)setTimeout(roll,500)}$('#roll').onclick=roll;restart=()=>{$('#roll').disabled=false;reset()};reset()}
function connect(){setup('connect','Puissance 4');let mode='cpu',board=Array(42).fill(0),turn=1,over=false;tools.append(btn('Vs ordinateur',()=>{mode='cpu';reset()}),btn('2 joueurs',()=>{mode='two';reset()}));let el=document.createElement('div');el.className='board';el.style.gridTemplateColumns='repeat(7,1fr)';area.append(el);function reset(){board=Array(42).fill(0);turn=1;over=false;say('Rouge commence');render()}function render(){el.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<7;c++){let v=board[r*7+c],x=btn(v===1?'🔴':v===-1?'🟡':'',()=>drop(c),'cell');x.style.borderRadius='50%';x.style.background='#283d63';el.append(x)}}function drop(c){if(over)return;let r=5;while(r>=0&&board[r*7+c])r--;if(r<0)return;board[r*7+c]=turn;if(win(r,c)){over=true;say((turn===1?'🔴 Rouge':'🟡 Jaune')+' gagne !')}else if(board.every(Boolean)){over=true;say('Match nul !')}else{turn*=-1;say(turn===1?'Au tour de Rouge':'Au tour de Jaune');if(mode==='cpu'&&turn===-1)setTimeout(ai,300)}render()}function win(r,c){let v=board[r*7+c];for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(let s of [-1,1]){let y=r+dr*s,x=c+dc*s;while(y>=0&&y<6&&x>=0&&x<7&&board[y*7+x]===v){n++;y+=dr*s;x+=dc*s}}if(n>=4)return true}return false}function ai(){let choices=[];for(let c=0;c<7;c++){let r=5;while(r>=0&&board[r*7+c])r--;if(r>=0){board[r*7+c]=-1;if(win(r,c)){board[r*7+c]=0;drop(c);return}board[r*7+c]=0;board[r*7+c]=1;if(win(r,c)){board[r*7+c]=0;choices.push(c)}else board[r*7+c]=0}}if(!choices.length)choices=[3,2,4,1,5,0,6];drop(choices[Math.floor(Math.random()*choices.length)])}restart=reset;reset()}
})();
