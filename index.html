<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Car Services | Location de voiture à Antananarivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="header">
    <div class="nav-container">
        <h1 id="brand-name">RENT CAR <span>SERVICES</span></h1>
        <div class="menu-burger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <nav id="nav-menu">
            <button onclick="openTab('home')">Accueil</button>
            <button onclick="openTab('cars')">Véhicules</button>
            <button onclick="openTab('booking')">Réserver</button>
            <button onclick="openTab('fun')">Divertissement</button>
            <button onclick="openTab('terms')">Conditions</button>
            <button onclick="openTab('contact')" class="nav-special">Contact</button>
        </nav>
    </div>
</header>

<main>
    <section id="home" class="tab active">
        <div id="hero-banner" class="hero">
            <div class="hero-content">
                <h2 id="hero-title">Chargement...</h2>
                <p id="hero-slogan" class="slogan-top"></p>
                
                <div class="hero-btns">
                    <button class="btn btn-primary" onclick="openTab('cars')"><i class="fas fa-car"></i> Voir les voitures</button>
                    <a id="hero-whatsapp" href="#" target="_blank" class="btn btn-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                </div>

                <p id="hero-desc" class="description-bottom"></p>
            </div>
        </div>
        
        <div class="container">
            <h2 class="section-title">Pourquoi nous choisir ?</h2>
            <div id="features-grid" class="features-grid"></div>
        </div>
    </section>

    <section id="cars" class="tab">
        <div class="container">
            <h2 class="section-title">Notre Flotte</h2>
            <div id="cars-grid" class="cars-grid"></div>
        </div>
    </section>

    <section id="booking" class="tab">
        <div class="container booking-page">
            <h2 class="section-title">Réservation en ligne</h2>
            <div class="booking-layout">
                <div class="booking-panel">
                    <h3>Vérifier les disponibilités</h3>
                    <div class="date-range">
                        <label>Date de départ<input id="availability-start" type="date"></label>
                        <label>Date de retour<input id="availability-end" type="date"></label>
                    </div>
                    <button class="btn btn-primary" onclick="checkAvailability()"><i class="fas fa-calendar-check"></i> Actualiser le calendrier</button>
                    <div id="availability-list" class="availability-list"><p class="muted">Choisissez vos dates pour voir la disponibilité.</p></div>
                </div>
                <div class="booking-panel">
                    <h3>Envoyer une demande</h3>
                    <form id="booking-form" onsubmit="submitReservation(event)">
                        <label>Voiture<select id="booking-vehicle" required></select></label>
                        <label>Nom complet<input id="booking-name" required placeholder="Votre nom et prénom"></label>
                        <label>Téléphone<input id="booking-phone" required placeholder="034 91 207 26"></label>
                        <label>Email<input id="booking-email" type="email" placeholder="votre@email.com"></label>
                        <div class="date-range">
                            <label>Date de départ<input id="booking-start-date" type="date" required></label>
                            <label>Heure de départ<select id="booking-start-time" required><option value="07:00">07h00</option><option value="19:00">19h00</option></select></label>
                            <label>Date de retour<input id="booking-end-date" type="date" required></label>
                            <label>Heure de retour<select id="booking-end-time" required><option value="18:00">18h00</option><option value="06:00">06h00</option></select></label>
                        </div>
                        <label class="checkbox-line"><input id="booking-driver" type="checkbox"> Avec chauffeur</label>
                        <label>Message<textarea id="booking-notes" rows="3" placeholder="Précisions, lieu de prise en charge..."></textarea></label>
                        <button class="btn btn-whatsapp btn-submit" type="submit"><i class="fas fa-paper-plane"></i> Envoyer la demande</button>
                    </form>
                    <p id="booking-result" class="booking-result" role="status"></p>
                </div>
            </div>
        </div>
    </section>

    <section id="terms" class="tab">
        <div class="container">
            <h2 class="section-title">Conditions de location</h2>
            <div id="conditions-grid" class="conditions-grid"></div>
        </div>
    </section>

    <section id="fun" class="tab">
        <div class="container">
            <h2 class="section-title">Divertissement</h2>
            <div id="radios-grid" class="radios-grid"></div>
        </div>
    </section>

    <section id="contact" class="tab">
        <div class="container">
            <div class="contact-wrapper">
                <h2 id="contact-title" style="text-align:center; color:var(--primary); margin-bottom:20px;">Contactez-nous</h2>
                <form id="dynamic-form" onsubmit="sendWhatsApp(event)"></form>
            </div>
        </div>
    </section>
</main>

<footer class="footer-fixed">
    <div class="container">
        <div id="footer-info" class="footer-text"></div>
        <div id="social-links" class="social-footer"></div>
    </div>
</footer>

<a id="fab-call" href="#" class="fab-call btn btn-primary">
    <i class="fas fa-phone-alt"></i>
    <span>Appelez-nous</span>
</a>

    <script src="supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
